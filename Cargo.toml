[package]
name = "oxmark"
version = "0.0.0"
edition = "2021"
rust-version = "1.87"
license = "Apache-2.0"
description = "A fast Rust implementation of Comark (Markdown with components)."
repository = "https://github.com/oxmark/oxmark"
readme = "README.md"
exclude = ["/scripts", "/tests/fixtures"]
keywords = ["markdown", "commonmark", "gfm", "comark", "parser"]
categories = ["parser-implementations", "text-processing"]

[features]
default = []
# Syntax highlighting of code blocks with oxlight, like Comark's highlight plugin.
highlight = ["dep:oxlight"]
# Mermaid diagrams rendered to SVG with oxmaid.
mermaid = ["dep:oxmaid"]

[dependencies]
# Git dependencies until oxlight and oxmaid have releases on crates.io.
oxlight = { git = "https://github.com/oxmark/oxlight", optional = true }
oxmaid = { git = "https://github.com/oxmark/oxmaid", optional = true }

[dev-dependencies]
serde_json = "1.0.154"
